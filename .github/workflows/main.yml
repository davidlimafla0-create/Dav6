
name: Gerar APK Cidade Alta

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Encontrar projeto
        id: projeto
        run: |
          DIR=$(find . -name settings.gradle -not -path './.git/*' -printf '%h\n' | head -n 1)
          if [ -z "$DIR" ]; then
            echo "Projeto Android não encontrado"
            exit 1
          fi
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Compilar APK
        run: gradle -p "${{ steps.projeto.outputs.dir }}" assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: CidadeAlta-APK
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
          
